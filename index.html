<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Z: Survival Shooter - Global Time Converter & Event Timer</title>

  <style>
    :root {
      --bg-dark: #0f1115;
      --card-bg: #1a1d24;
      --card-border: #2a2e39;
      --accent-red: #e63946;
      --accent-orange: #f4a261;
      --accent-green: #2a9d8f;
      --text-main: #f1faee;
      --text-sub: #a8b2d1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 2px solid var(--accent-red);
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .title-area h1 {
      font-size: 1.8rem;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-area h1 span {
      color: var(--accent-red);
    }

    .lang-switch {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 3px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 6px 16px;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .lang-btn.active {
      background: var(--accent-red);
      color: #fff;
    }

    /* Main Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .card-header {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: var(--accent-orange);
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    /* Server Clock Card */
    .server-clock-box {
      text-align: center;
      background: rgba(230, 57, 70, 0.1);
      border: 1px solid var(--accent-red);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .server-clock {
      font-size: 2.8rem;
      font-weight: bold;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 2px;
    }

    .reset-timer {
      font-size: 1.1rem;
      color: var(--accent-green);
      font-weight: bold;
      margin-top: 10px;
    }

    .progress-bar-bg {
      background: #2b303c;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar-fill {
      background: var(--accent-green);
      height: 100%;
      width: 0%;
      transition: width 1s linear;
    }

    /* World Clocks List */
    .world-clock-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .clock-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
    }

    .clock-location {
      font-weight: 600;
      color: var(--text-main);
    }

    .clock-timezone {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .clock-time {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-orange);
    }

    /* Interactive Converter */
    .converter-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="time"] {
      background: #2b303c;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 1.1rem;
      flex: 1;
      color-scheme: dark;
    }

    button.btn {
      background: var(--accent-red);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button.btn:hover {
      background: #c72c38;
    }

    .converted-results {
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 15px;
      font-size: 0.95rem;
    }

    .copy-btn {

      background: var(--accent-green);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
